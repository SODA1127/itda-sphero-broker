<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>팔달관 층별 도면</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1c1c1c;--mute:#6b6b6b;--line:#e2dfd8;--acc:#c0392b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
header{padding:20px 24px 8px;max-width:1500px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px}
header p{margin:0;color:var(--mute);font-size:13px;line-height:1.6}
nav{display:flex;gap:8px;padding:12px 24px;max-width:1500px;margin:0 auto;flex-wrap:wrap}
nav button,.tools button{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:8px;font:inherit;font-size:14px;cursor:pointer}
nav button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.floor{display:none;max-width:1500px;margin:0 auto;padding:0 24px 32px;gap:20px;grid-template-columns:minmax(0,1fr) 340px}
.floor.on{display:grid}
.plan{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;overflow:auto}
.plan svg{width:100%;height:auto;display:block}
.side{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;align-self:start}
.side h2{font-size:15px;margin:0 0 8px}
table{width:100%;border-collapse:collapse;font-size:13px}
td{padding:4px 2px;border-bottom:1px solid var(--line);vertical-align:middle}
td.id{color:var(--acc);font-weight:700;width:34px}
td.v{width:92px}
td.v input{width:62px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;font:inherit;text-align:right}
td.v span{color:var(--mute);margin-left:3px}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
@media (max-width:1000px){.floor.on{grid-template-columns:1fr}}
@media print{nav,.side .tools,header p{display:none}.floor{display:grid!important;grid-template-columns:1fr;page-break-after:always}body{background:#fff}td.v input{border:none}}
</style></head><body>
<header><h1>팔달관 층별 도면 (실측 기입용)</h1>
<p>피난안내도를 바탕으로 그린 개략도라 축척이 맞지 않습니다. 오른쪽 표에 실측값(m)을 넣으면 도면의 빨간 치수에 바로 표시되고, 이 브라우저에 자동 저장됩니다.<br>
2층은 안내판이 180° 돌아가 있어서 1·3층과 같은 방향(엘리베이터가 아래쪽 가운데)으로 돌려 그렸습니다.</p></header>
<nav id="tabs"></nav>

const KEY = "paldal-dims-v1";
let vals = {};
try { vals = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(vals)); } catch (e) {} };

const tabs = document.getElementById("tabs"), wrap = document.getElementById("floors");
DATA.forEach((f, i) => {
  const b = document.createElement("button"); b.textContent = f.title; b.dataset.i = i; tabs.appendChild(b);
  const sec = document.createElement("section"); sec.className = "floor"; sec.dataset.i = i;
  sec.innerHTML = `<div class="plan">${f.svg}</div><div class="side"><h2>${f.title} 치수</h2><table>${
    f.dims.map(([id, d]) => `<tr><td class="id">${id}</td><td>${d}</td><td class="v"><input inputmode="decimal" data-f="${f.id}" data-id="${id}"><span>m</span></td></tr>`).join("")
  }</table><div class="tools"><button data-act="svg">SVG 저장</button><button data-act="csv">CSV 저장</button><button data-act="print">인쇄/PDF</button></div></div>`;
  wrap.appendChild(sec);
});
function show(i){ document.querySelectorAll("nav button,.floor").forEach(el => el.classList.toggle("on", el.dataset.i == i)); }
tabs.onclick = e => { if (e.target.dataset.i != null) show(e.target.dataset.i); };
show(0);

function paint(fid, id){
  const sec = [...document.querySelectorAll(".floor")].find(s => DATA[s.dataset.i].id === fid);
  const v = vals[fid + ":" + id];
  sec.querySelectorAll(`[data-dim="${id}"]`).forEach(t => t.textContent = v ? `${id} ${v}m` : id);
}
document.querySelectorAll("input[data-id]").forEach(inp => {
  const k = inp.dataset.f + ":" + inp.dataset.id;
  if (vals[k]) inp.value = vals[k];
  paint(inp.dataset.f, inp.dataset.id);
  inp.addEventListener("input", () => { const v = inp.value.trim(); if (v) vals[k] = v; else delete vals[k]; save(); paint(inp.dataset.f, inp.dataset.id); });
});
function dl(name, text, type){ const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }
wrap.onclick = e => {
  const act = e.target.dataset.act; if (!act) return;
  const sec = e.target.closest(".floor"), f = DATA[sec.dataset.i];
  if (act === "svg") dl(`팔달관_${f.id}_도면.svg`, sec.querySelector("svg").outerHTML, "image/svg+xml");
  if (act === "csv") dl(`팔달관_${f.id}_치수.csv`, "﻿기호,구간,실측(m)\n" + f.dims.map(([id, d]) => `${id},${d},${vals[f.id + ":" + id] || ""}`).join("\n"), "text/csv");
  if (act === "print") window.print();
};
